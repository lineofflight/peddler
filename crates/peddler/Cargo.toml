[package]
name = "peddler"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "form", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

progenitor-client = "=0.15.0"
futures-util = "0.3"
percent-encoding = "2"
tokio = { version = "1", features = ["time", "sync"] }
httpdate = "1"
fastrand = "2"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
