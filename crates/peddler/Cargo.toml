[package]
name = "peddler"
version = "0.1.0"
edition = "2024"
description = "Rust client for Amazon's Selling Partner API (SP-API) with typed operations, retries and document transfers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/lineofflight/peddler"
homepage = "https://github.com/lineofflight/peddler"
documentation = "https://docs.rs/peddler"
keywords = ["amazon", "sp-api", "selling-partner", "marketplace", "ecommerce"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src/**", "/README.md", "/LICENSE", "/Cargo.toml"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "form", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

futures-util = "0.3"
regress = "0.12"
percent-encoding = "2"
tokio = { version = "1", features = ["time", "io-util"] }
httpdate = "1"
fastrand = "2"

bytes = "1"
async-stream = "0.3"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
csv-core = "0.1"
encoding_rs = "0.8"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "test-util"] }
