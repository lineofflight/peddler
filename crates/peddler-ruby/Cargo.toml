[package]
name = "peddler_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "peddler_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
magnus = { version = "0.9.0", default-features = false, features = ["rb-sys"] }
rb-sys = { version = "0.9.124", default-features = false, features = ["stable-api-compiled-fallback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
peddler = { path = "../peddler" }
bytes = "1"
futures-util = "0.3"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }

[build-dependencies]
rb-sys-env = "0.2.3"
