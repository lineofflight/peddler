[package]
name = "peddler-codegen"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
typify = { version = "=0.8.0", default-features = false }
schemars = "0.8"
serde_json = { version = "1", features = ["arbitrary_precision"] }
syn = { version = "2", features = ["full"] }
quote = "1"
prettyplease = "=0.2.37"
heck = "0.5"
tempfile = "3"
progenitor = { version = "=0.15.0", default-features = false }

[dev-dependencies]
peddler = { path = "../peddler" }
