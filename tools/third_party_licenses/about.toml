# What cargo-about is told when it writes the licence notices of a platform gem.
# See tools/third_party_licenses.rb.

# The licences a crate linked into the extension may have. Where a crate offers a
# choice, the first one listed here is taken. A crate that none of these satisfies
# fails the packaging step: read its licence before adding it here.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

# Only what ends up in the binary: no build scripts and no tests.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The extension is Peddler's own, under the gem's licence.
private = { ignore = true }

# chrono keeps its 2 licences in 1 file.
workarounds = ["chrono"]

# 7 crates ship a license file that cargo-about doesn't take by itself, so it would
# print the standard text of the license, without the crate's copyright line. Each
# entry points at the file the crate ships. The last entry, for encoding_rs, keeps a
# source file out of the notices. A checksum is of the text that is used:
# the file, or the part from `start` to `end`. When a new version of the crate changes
# that text, the tool fails and names the crate: read the new file, then update the
# entry.

# Its MIT text is wrapped narrowly, which cargo-about scores too low.
[async-stream.clarify]
license = "MIT"

[[async-stream.clarify.files]]
path = "LICENSE"
checksum = "157d381f6304eba77459fc10dfb5b1b22fc0d04e384a32865f32d8e67a34c0eb"

# Their MIT text is indented by 4 spaces, which cargo-about scores too low. Only
# the Windows gem links them.
[windows-link.clarify]
license = "MIT OR Apache-2.0"

[[windows-link.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

[[windows-link.clarify.files]]
path = "license-apache-2.0"
license = "Apache-2.0"
checksum = "c16f8dcf1a368b83be78d826ea23de4079fe1b4469a0ab9ee20563f37ff3d44b"

[windows-sys.clarify]
license = "MIT OR Apache-2.0"

[[windows-sys.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

