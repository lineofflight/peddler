name: Update models

on:
  schedule:
    # Run daily at 2:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  update-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Advances selling-partner-api-models.sha, then regenerates the whole corpus: the Ruby
      # models and the Rust crate (models, facades, dispatch, pagination table, Ruby facades
      # and operation-inventory.json). The Rust step installs the locked converter (npm ci)
      # and builds with --locked.
      - name: Regenerate Ruby and Rust output at the new pin
        run: bundle exec rake generate:update

      # The Rust generator reads the committed manifest (ALL_APIS), supplemental-sources.json,
      # the PIN constant and pagination.json. Nothing here rewrites them, so a new API, a
      # removed spec file or an unmapped pagination field fails the step above.

      # Peddler 6 has no Ruby API classes. Generation must not bring them back.
      - name: Refuse regenerated HTTP API classes
        run: |
          if grep -rEl '(<|include|extend) +(::)?(Peddler::)?API\b|require +"http"|HTTP\.' lib/peddler.rb lib/peddler/apis sig/peddler.rbs sig/peddler/apis; then
            echo "Generated Ruby code references the removed HTTP API classes." >&2
            exit 1
          fi
          if ls lib/peddler/apis/*.rb | xargs grep -L 'PARSERS' | grep .; then
            echo "A generated API file lacks PARSERS; the Ruby templates changed." >&2
            exit 1
          fi

      - name: Explain a failed update
        if: failure()
        run: |
          {
            echo "### Model update failed"
            echo
            echo "No pull request was opened. Generation stopped at the new Amazon spec revision."
            echo
            echo "- Pagination: the generator fails when an operation has a token-like parameter or"
            echo "  response field that \`crates/peddler-codegen/pagination.json\` neither maps nor"
            echo "  excludes. Map it or exclude it with a reason, in a normal pull request on main."
            echo "- Inventory: a new or removed spec file fails the pinned inventory check. Update"
            echo "  \`crates/peddler-codegen/src/manifest.rs\` and"
            echo "  \`crates/peddler-codegen/supplemental-sources.json\` by hand."
            echo "- The PIN constant in \`crates/peddler-codegen/src/supplemental.rs\` stays at the"
            echo "  reviewed revision. Source hashes are only checked at that revision."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        id: create-pr
        uses: actions/github-script@v8
        env:
          MACHINE_USER_NAME: ${{ secrets.MACHINE_USER_NAME }}
          MACHINE_USER_EMAIL: ${{ secrets.MACHINE_USER_EMAIL }}
        with:
          github-token: ${{ secrets.MACHINE_USER_PAT }}
          script: |
            const { execSync } = require('child_process');

            // Check for changes
            const status = execSync('git status --porcelain', { encoding: 'utf8' });
            if (!status.trim()) {
              console.log('No changes');
              return;
            }

            // Configure git
            execSync(`git config user.name "${process.env.MACHINE_USER_NAME}"`);
            execSync(`git config user.email "${process.env.MACHINE_USER_EMAIL}"`);

            // Use fixed branch name and handle existing branch
            const branchName = 'update-api-models';

            // Delete remote branch if it exists
            try {
              execSync(`git push origin --delete ${branchName}`, { stdio: 'ignore' });
            } catch (e) {
              // Branch doesn't exist remotely, that's fine
            }

            // Delete local branch if it exists
            try {
              execSync(`git branch -D ${branchName}`, { stdio: 'ignore' });
            } catch (e) {
              // Branch doesn't exist locally, that's fine
            }

            execSync(`git checkout -b ${branchName}`);
            execSync('git add -A');
            execSync('git commit -m "Update Amazon models"');
            execSync(`git push --set-upstream origin ${branchName}`);

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Update Amazon models',
              body: 'Summarizing changes...',
              head: branchName,
              base: 'main'
            });

            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
            core.setOutput('pr_number', pr.number);

      - name: Summarize changes
        if: steps.create-pr.outputs.pr_number
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.create-pr.outputs.pr_number }}

            A nightly job pulled in the latest Amazon SP-API specs and regenerated the Ruby and Rust code, including the operation inventory and the pin file. Review the diff and update the PR description with a high-level, concise summary of what's new, removed, or breaking. Group changes by API or theme. Don't list changes individually. Use plain text only, no markdown. The description will become a squash commit body, so don't repeat the PR title.

            Then, if any user-visible interface changed (new or removed methods, new parameters, new fields on response types), append concise entries to the [Unreleased] section of CHANGELOG.md under the `### Models` header. Format them as bullet points prefixed with `**Added**:`, `**Changed**:`, or `**Removed**:` to distinguish the update type. Commit and push to the PR branch.
          claude_args: |
            --model sonnet
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Read,Edit"
            --system-prompt "Relaxed, direct, still professional tone. Be concise. No emojis."
