name: Native crates

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: cargo fmt --all --check
      - run: cargo test -p peddler --locked
      - run: cargo clippy -p peddler --all-targets --locked -- -D warnings

  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Sync pinned specs
        run: bundle exec rake generate:rust:setup
      - run: cargo test -p peddler-codegen --locked
      - run: cargo clippy -p peddler-codegen --all-targets --locked -- -D warnings
      - name: Check deterministic committed output
        run: |
          cargo run -p peddler-codegen --locked -- --root . --check
          cargo run -p peddler-codegen --locked -- --root . --check

  binding:
    # ci.yml builds the extension and runs the whole suite for each Ruby. This job
    # covers only what it does not: the shared-fixture export and the binding lint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - run: ruby tools/export_native_fixtures.rb --check
      - name: Lint binding
        run: RUBY="$(ruby -rrbconfig -e 'print RbConfig.ruby')" cargo clippy --workspace --all-targets --locked -- -D warnings
